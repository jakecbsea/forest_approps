name: Update Tier 1 data (monthly, no AI)

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch USASpending data
        run: python scripts/fetch_usaspending.py

      - name: Fetch Congress.gov data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/fetch_congress.py

      - name: Commit updated data
        run: |
          git config user.name "wildfire-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/obligations.json docs/data/congress_status.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Automated monthly data refresh"
          git push
